name: Reset Beta

# Manually triggered. Wipes the beta database and replaces it with a fresh
# copy of production via util/sync_beta_db.sh.
on:
  workflow_dispatch:

jobs:
  reset-beta:
    runs-on: ubuntu-latest
    environment: beta
    steps:
      - name: Reset beta database via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SERVICE_HOST }}
          username: ${{ secrets.SERVICE_SSH_USERNAME }}
          key: ${{ secrets.SERVICE_AUTHORIZED_SSH_KEY }}
          port: ${{ secrets.SERVICE_SSH_PORT || 22 }}
          script: |
            set -euo pipefail
            APP_DIR="${{ secrets.SERVICE_APP_DIR }}"
            # Secret values aren't shell-expanded, so a leading "~" in the
            # secret wouldn't otherwise resolve to the home directory. Expand
            # it manually here.
            APP_DIR="${APP_DIR/#\~/$HOME}"
            cd "$APP_DIR/packman"
            util/sync_beta_db.sh
