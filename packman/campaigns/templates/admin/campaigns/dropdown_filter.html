{% load i18n %}

<details data-filter-title="{{ title }}" open>
  <summary>
    {% blocktranslate with filter_title=title %} By {{ filter_title }} {% endblocktranslate %}
  </summary>
  <div class="dropdown-filter">
    <select data-dropdown-filter
            {% if spec.searchable %}data-searchable{% endif %}
            aria-label="{% blocktranslate with filter_title=title %}Filter by {{ filter_title }}{% endblocktranslate %}"
            style="width: 100%">
      {% for choice in choices %}
        <option value="{{ choice.query_string|iriencode }}"
                {% if choice.selected %}selected{% endif %}>{{ choice.display }}</option>
      {% endfor %}
    </select>
  </div>
</details>
